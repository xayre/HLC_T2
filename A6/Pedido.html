<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar un Pedido</title>
    <script>
        function mostrarDatos(event) {
            event.preventDefault(); // Evita el envío del formulario
            const form = document.getElementById('pedidoForm');
            const nombre = form.nombre.value;
            const producto = form.producto.value;
            const cantidad = form.cantidad.value;
            const observaciones = form.observaciones.value;

            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = `
                <h3>Datos del Pedido:</h3>
                <p><strong>Nombre:</strong> ${nombre}</p>
                <p><strong>Producto:</strong> ${producto}</p>
                <p><strong>Cantidad:</strong> ${cantidad}</p>
                <p><strong>Observaciones:</strong> ${observaciones}</p>
            `;
        }
    </script>
</head>
<body>

<h1>Realizar un Pedido</h1>

<form id="pedidoForm" onsubmit="mostrarDatos(event)">
<label for="nombre">Nombre:</label>
<input type="text" id="nombre" required minlength="3" maxlength="50" required><br><br>

<label for="producto">Producto:</label>
<input list="sugerencias" id="producto" required>
<datalist id="sugerencias">
    <option value="Mario y Luigi: Conexión Fraternal">
    <option value="Monster Hunter Rise">
    <option value="Kirby´s return to dreamland Deluxe">
</datalist><br><br>

<label for="cantidad">Cantidad:</label>
	<input type="number" id="cantidad" required minlength="1" maxlength="10" required></input><br><br>

<label for="observaciones">Observaciones:</label><br>
<textarea id="observaciones" name="observaciones" rows="4" cols="20"></textarea><br>

  
<input type="submit" value="Registrarse">
<input type="reset" value="Resetear">
</form>


<div id="resultado"></div>
    
</body>
</html>
